# Jalankan:  cp .env.docker.example .env && nano .env && docker compose up -d --build
name: presisi-rent-car
services:
  api:
    build: .
    image: presisi-api:latest
    container_name: presisi-api
    restart: unless-stopped
    env_file: .env
    # Nilai di bawah selalu menang atas isi .env (supaya salah isi .env tidak merusak jaringan/data).
    environment:
      APP_ENV: production
      DATA_DIR: /data
      LISTEN_ADDR: ":8080"
      TRUST_PROXY: "1"
    # Hanya localhost di host. Docker mengabaikan firewall ufw untuk port yang dipublikasikan,
    # jadi JANGAN tulis "8081:8080" (itu terbuka ke internet). Akses publik lewat Caddy.
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8081}:8080"
    volumes:
      - presisi-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  presisi-data:
