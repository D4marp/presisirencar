# Blok nginx untuk API PRESISI Rent Car (kontainer Docker di 127.0.0.1:8081).
# Ganti API_DOMAIN_ANDA dengan domain API. Sertifikat HTTPS ditambahkan oleh certbot:
#   certbot --nginx -d API_DOMAIN_ANDA
server {
    listen 80;
    listen [::]:80;
    server_name API_DOMAIN_ANDA;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Unggah foto mobil: maksimal 5 MB (hanya admin yang lolos di sisi API)
    location = /api/uploads {
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        # Sengaja DIGANTI (bukan ditambah) agar klien tidak bisa memalsukan IP untuk rate limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # API lain hanya menerima JSON kecil
    location /api/ {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
